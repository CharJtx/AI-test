<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scene Editor</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <!-- ── Top Bar ── -->
  <header class="topbar">
    <div class="topbar-left">
      <a href="/playground/" class="back-link">← 返回</a>
      <h1>场景编辑器</h1>
    </div>
    <div class="topbar-actions">
      <button id="btn-save" class="btn primary" disabled>保存</button>
      <button id="btn-download-json" class="btn" disabled>下载 JSON</button>
      <a id="link-preview" class="btn" target="_blank" style="display:none">预览 ▶</a>
    </div>
  </header>

  <main class="editor-layout">
    <!-- ── Left: Scene + Config ── -->
    <aside class="sidebar">
      <section class="card">
        <h2>场景</h2>
        <div class="field-row">
          <select id="scene-select"><option value="">-- 选择场景 --</option></select>
          <button id="btn-new-scene" class="btn small">新建</button>
        </div>
        <div class="state-field" style="margin-top:8px;">
          <label>KOL ID</label>
          <input type="text" id="kol-id" class="text-input" placeholder="留空表示无关联 KOL">
        </div>
      </section>

      <section class="card" id="sec-grid">
        <h2>网格配置</h2>
        <div class="field-row">
          <label>列 <input type="number" id="grid-cols" min="1" max="20" value="5" class="num-input"></label>
          <label>行 <input type="number" id="grid-rows" min="1" max="20" value="2" class="num-input"></label>
        </div>
      </section>

      <section class="card" id="sec-loading">
        <h2>加载页</h2>
        <div class="state-field">
          <label>背景图片 URL</label>
          <input type="text" id="loading-bg" class="text-input" placeholder="https://...（留空为默认黑色）">
        </div>
        <div id="loading-bg-preview" class="loading-bg-preview" hidden></div>
      </section>

      <section class="card" id="sec-bgm">
        <h2>BGM 背景音乐</h2>
        <div class="state-field">
          <label>音频 URL</label>
          <input type="text" id="bgm-url" class="text-input" placeholder="https://...（留空无 BGM）">
        </div>
        <div class="state-field">
          <label>音量 <span id="bgm-vol-val">0.5</span></label>
          <input type="range" id="bgm-volume" min="0" max="1" step="0.05" value="0.5" style="width:100%">
        </div>
        <div class="state-field">
          <div class="toggle-row">
            <input type="checkbox" id="bgm-loop" checked>
            <span>循环播放</span>
          </div>
        </div>
        <button id="bgm-preview-btn" class="btn small">试听</button>
      </section>

      <section class="card" id="sec-resources">
        <h2>素材 <span id="res-count" class="badge">0</span></h2>
        <div id="upload-zone" class="upload-zone">
          <input type="file" id="file-input" multiple accept="video/*,audio/*" hidden>
          <div class="upload-hint">拖拽文件到此处<br>或 <button id="btn-browse" class="link-btn">点击选择</button></div>
        </div>
        <div class="url-add-row">
          <input type="text" id="url-input" class="text-input" placeholder="输入视频 URL（https://...）" style="flex:1">
          <button id="btn-add-url" class="btn small">+ URL</button>
        </div>
        <div id="resource-list" class="resource-list"></div>
      </section>

      <section class="card">
        <h2>初始状态</h2>
        <select id="initial-state"><option value="">-- 请先添加状态 --</option></select>
      </section>
    </aside>

    <!-- ── Center: States ── -->
    <div class="main-content">
      <div class="section-header">
        <h2>状态列表</h2>
        <div style="display:flex;gap:6px;margin-left:auto">
          <button id="btn-toggle-all" class="btn small">全部收起</button>
          <button id="btn-add-state" class="btn small">+ 添加状态</button>
        </div>
      </div>
      <div id="state-list" class="state-list">
        <div class="empty-hint">选择或创建场景后开始编辑</div>
      </div>
    </div>
  </main>

  <!-- ── Toast ── -->
  <div id="toast" class="toast"></div>

  <script src="editor.js"></script>
</body>
</html>
