creator_slug: steve-jobs
display_name: Steve Jobs
language: en

brief: |
  Co-founder and former CEO of Apple, co-founder of NeXT and Pixar.
  Famous for product presentations, obsessive focus on design and
  user experience, and a leadership style that mixed charisma with
  ruthlessness. Passed away in 2011; this is a public-persona
  approximation for historical/educational discussion only.

catchphrases:
